<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're Invited — Tabby &amp; Mesheck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:    #c8581a;
      --gold-lt: #e07840;
      --dark:    #1e140c;
      --cream:   #fdf8f2;
      --env-bg:  #f0e0cc;
      --env-mid: #e2cbb0;
      --env-dk:  #c8a882;
    }

    body {
      font-family: 'Lato', sans-serif;
      background: radial-gradient(ellipse at 50% 40%, #2c1a0e 0%, #0e0806 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    /* ── Petals ──────────────────────────────────── */
    .petals { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .petal  { position: absolute; bottom: -60px; opacity: 0; animation: floatUp linear infinite; }
    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
      10%  { opacity: .6; }
      90%  { opacity: .3; }
      100% { transform: translateY(-110vh) rotate(720deg); opacity: 0; }
    }

    /* ── Scene ───────────────────────────────────── */
    .scene {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; text-align: center;
      gap: 1.8rem; padding: 2rem;
    }

    .pre-label {
      font-size: .68rem; letter-spacing: .35em; text-transform: uppercase;
      color: rgba(255,255,255,.45);
      animation: fadeUp 1.6s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Envelope container ──────────────────────── */
    /*
      Layer order (bottom → top):
        1. .env-base        — envelope body background
        2. .env-flap-back   — back/bottom V-shape (decorative)
        3. .env-side-l/r    — left & right triangles
        4. .env-card        — the letter card  ← sits ABOVE flap
        5. .env-flap        — top flap (opens upward, z-index below card when opened)
        6. .env-seal        — wax seal (highest, clickable)
    */
    .envelope-wrap {
      position: relative;
      width: 360px; height: 240px;
      animation: float 3.5s ease-in-out infinite, fadeUp 1s ease .2s both;
      filter: drop-shadow(0 24px 48px rgba(200,88,26,.3))
              drop-shadow(0 4px 12px rgba(0,0,0,.5));
      perspective: 800px;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-14px); }
    }
    .envelope-wrap.opened { animation: none; }

    /* 1 — Base body */
    .env-base {
      position: absolute; inset: 0;
      background: linear-gradient(160deg, #f8ead8 0%, #ead4b4 60%, #dcc09a 100%);
      border-radius: 6px;
      z-index: 1;
    }
    /* Subtle inner border line */
    .env-base::after {
      content: '';
      position: absolute; inset: 1px;
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,.35);
      pointer-events: none;
    }

    /* 2 — Bottom V decoration */
    .env-flap-back {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 0; z-index: 2;
      border-left:  180px solid transparent;
      border-right: 180px solid transparent;
      border-bottom: 130px solid #d4b48a;
    }

    /* 3 — Side triangles */
    .env-side-l {
      position: absolute; top: 0; left: 0; z-index: 3;
      width: 0; height: 0;
      border-top:    120px solid transparent;
      border-bottom: 120px solid transparent;
      border-left:   180px solid #e8d0b0;
    }
    .env-side-r {
      position: absolute; top: 0; right: 0; z-index: 3;
      width: 0; height: 0;
      border-top:    120px solid transparent;
      border-bottom: 120px solid transparent;
      border-right:  180px solid #ddc4a0;
    }

    /* Gold edge accent lines */
    .env-accent {
      position: absolute; inset: 0; z-index: 4; pointer-events: none;
      border-radius: 6px;
      border: 1.5px solid rgba(200,88,26,.25);
    }
    /* Corner dots */
    .env-accent::before, .env-accent::after {
      content: '';
      position: absolute;
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(200,88,26,.35);
    }
    .env-accent::before { bottom: 8px; left: 8px; }
    .env-accent::after  { bottom: 8px; right: 8px; }

    /* 4 — Letter card — z-index 20 so it appears IN FRONT when raised */
    .env-card {
      position: absolute;
      left: 28px; right: 28px;
      bottom: 16px;
      height: 180px;
      z-index: 20;                          /* above flap */
      background: linear-gradient(150deg, #fffdf9 0%, #fdf5ea 100%);
      border-radius: 6px;
      border: 1px solid rgba(200,88,26,.18);
      box-shadow:
        0 -6px 24px rgba(0,0,0,.2),
        0 2px 8px rgba(0,0,0,.1),
        inset 0 1px 0 rgba(255,255,255,.8);
      transform: translateY(4px);           /* sits flush inside */
      transition: transform 1s cubic-bezier(.22,.68,0,1.2) .4s;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: .4rem; overflow: hidden;
    }
    /* Gold top stripe */
    .env-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, transparent 0%, var(--gold) 40%, var(--gold-lt) 60%, transparent 100%);
    }
    /* Watermark */
    .env-card::after {
      content: '💍';
      position: absolute; font-size: 5rem; opacity: .04;
      bottom: -10px; right: 10px; pointer-events: none;
    }
    .card-eyebrow {
      font-size: .6rem; letter-spacing: .25em; text-transform: uppercase;
      color: var(--gold); font-weight: 700;
    }
    .card-names {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.7rem; font-weight: 600;
      color: var(--dark); letter-spacing: .04em; line-height: 1;
    }
    .card-amp { color: var(--gold); }
    .card-rule {
      width: 50px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .card-date {
      font-size: .65rem; letter-spacing: .2em;
      text-transform: uppercase; color: var(--gold); font-weight: 700;
    }
    .card-verse {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-size: .88rem;
      color: #8a6040; padding: 0 1.5rem;
      text-align: center; line-height: 1.5;
    }

    /* Raised state — card lifts in front of everything */
    .envelope-wrap.opened .env-card {
      transform: translateY(-190px);
    }

    /* 5 — Top flap — z-index 15: above base/sides but BELOW card (20) when opened */
    .env-flap {
      position: absolute; top: 0; left: 0;
      width: 0; height: 0;
      border-left:  180px solid transparent;
      border-right: 180px solid transparent;
      border-top:   130px solid #d8bc98;
      transform-origin: top center;
      transform: rotateX(0deg);
      transition: transform .8s cubic-bezier(.4,0,.2,1) .1s;
      z-index: 15;
    }
    /* Flap inner shadow line */
    .env-flap::after {
      content: '';
      position: absolute;
      top: -130px; left: -180px; right: -180px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(200,88,26,.3), transparent);
    }
    .envelope-wrap.opened .env-flap {
      transform: rotateX(-185deg);           /* opens back fully */
    }

    /* 6 — Wax seal — z-index 30: always on top */
    .env-seal {
      position: absolute;
      top: 38px; left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      cursor: pointer;
      width: 68px; height: 68px;
    }
    /* Pulse ring */
    .env-seal::before {
      content: '';
      position: absolute; inset: -8px; border-radius: 50%;
      border: 2px solid rgba(200,88,26,.5);
      animation: sealGlow 1.8s ease-in-out infinite;
    }
    @keyframes sealGlow {
      0%, 100% { transform: scale(1);    opacity: .4; }
      50%       { transform: scale(1.22); opacity: 1; }
    }
    .seal-circle {
      width: 68px; height: 68px; border-radius: 50%;
      background: conic-gradient(from 180deg, #b84010, #e06020, #c84818, #a83010, #b84010);
      border: 3px solid rgba(255,210,170,.35);
      box-shadow:
        0 5px 20px rgba(0,0,0,.5),
        0 1px 0 rgba(255,200,150,.3),
        inset 0 2px 6px rgba(255,200,150,.2),
        inset 0 -3px 6px rgba(0,0,0,.35);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1px;
      transition: transform .2s, box-shadow .2s;
      position: relative; overflow: hidden;
    }
    /* Wax gloss */
    .seal-circle::before {
      content: '';
      position: absolute; top: 4px; left: 10px;
      width: 22px; height: 10px; border-radius: 50%;
      background: rgba(255,255,255,.18);
      transform: rotate(-20deg);
    }
    .env-seal:hover .seal-circle {
      transform: scale(1.1);
      box-shadow: 0 8px 28px rgba(200,88,26,.8), inset 0 2px 6px rgba(255,200,150,.2);
    }
    .seal-monogram {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem; font-weight: 600;
      color: rgba(255,230,210,.95);
      letter-spacing: .06em; line-height: 1;
      z-index: 1; user-select: none;
    }
    .seal-icon { font-size: .85rem; z-index: 1; line-height: 1; }

    /* Seal break */
    .env-seal.breaking::before { animation: none; opacity: 0; }
    .env-seal.breaking .seal-circle {
      animation: sealBreak .45s ease forwards;
    }
    @keyframes sealBreak {
      0%   { transform: scale(1);    opacity: 1; }
      25%  { transform: scale(1.2)  rotate(-5deg); }
      55%  { transform: scale(.85)  rotate(6deg); opacity: .6; }
      100% { transform: scale(0)    rotate(12deg); opacity: 0; }
    }

    /* ── Hint & message ──────────────────────────── */
    .click-hint {
      font-size: .7rem; letter-spacing: .25em; text-transform: uppercase;
      color: rgba(255,255,255,.55);
      animation: hintPulse 2.2s ease-in-out infinite, fadeUp 2.2s ease both;
      transition: opacity .4s;
    }
    @keyframes hintPulse {
      0%, 100% { opacity: .55; }
      50%       { opacity: 1; }
    }

    .opening-msg {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.35rem; font-style: italic;
      color: rgba(255,255,255,.88);
      opacity: 0; transform: translateY(10px);
      transition: opacity .7s ease, transform .7s ease;
      min-height: 2rem;
    }
    .opening-msg.show { opacity: 1; transform: translateY(0); }

    /* ── Fade overlay ────────────────────────────── */
    .fade-overlay {
      position: fixed; inset: 0; z-index: 999;
      background: var(--cream);
      opacity: 0; pointer-events: none;
      transition: opacity 1.1s ease;
    }
    .fade-overlay.active { opacity: 1; pointer-events: all; }

  </style>
</head>
<body>

  <div class="petals" id="petals"></div>
  <div class="fade-overlay" id="overlay"></div>

  <div class="scene">
    <p class="pre-label">✦ &nbsp; A special invitation awaits you &nbsp; ✦</p>

    <div class="envelope-wrap" id="envelope">

      <!-- Layer 1: base -->
      <div class="env-base"></div>

      <!-- Layer 2: bottom V -->
      <div class="env-flap-back"></div>

      <!-- Layer 3: sides -->
      <div class="env-side-l"></div>
      <div class="env-side-r"></div>

      <!-- Gold accent border -->
      <div class="env-accent"></div>

      <!-- Layer 4: card (z-index 20 — rises IN FRONT of flap) -->
      <div class="env-card">
        <span class="card-eyebrow">You are invited</span>
        <div class="card-names">
          Tabby <span class="card-amp">&amp;</span> Mesheck
        </div>
        <div class="card-rule"></div>
        <div class="card-date">14 · November · 2026</div>
        <div class="card-verse">"I found him whom my soul loves."</div>
      </div>

      <!-- Layer 5: top flap (z-index 15) -->
      <div class="env-flap"></div>

      <!-- Layer 6: wax seal (z-index 30) -->
      <div class="env-seal" id="seal" role="button" tabindex="0" aria-label="Click the seal to open your invitation">
        <div class="seal-circle">
          <span class="seal-monogram">T&amp;M</span>
          <span class="seal-icon">💍</span>
        </div>
      </div>

    </div>

    <p class="click-hint" id="hint">Click the seal to open</p>
    <p class="opening-msg" id="opening-msg">Opening your invitation…</p>
  </div>

  <script>
    // ── Petals ──────────────────────────────────────
    var colours = ['#c8581a','#e07840','#f0a060','#d4946a','#e8c4a0','#fff0e6'];
    var petalEl = document.getElementById('petals');
    for (var i = 0; i < 26; i++) {
      var p = document.createElement('div');
      p.className = 'petal';
      p.style.left              = Math.random() * 100 + 'vw';
      p.style.background        = colours[Math.floor(Math.random() * colours.length)];
      p.style.width             = (7  + Math.random() * 11) + 'px';
      p.style.height            = (9  + Math.random() * 13) + 'px';
      p.style.animationDuration = (7  + Math.random() * 10) + 's';
      p.style.animationDelay    = (Math.random() * 9) + 's';
      p.style.borderRadius      = Math.random() > .5 ? '50% 0 50% 0' : '0 50% 0 50%';
      petalEl.appendChild(p);
    }

    // ── Seal click → open → navigate ───────────────
    var seal       = document.getElementById('seal');
    var envelope   = document.getElementById('envelope');
    var hint       = document.getElementById('hint');
    var openingMsg = document.getElementById('opening-msg');
    var overlay    = document.getElementById('overlay');
    var triggered  = false;

    function openInvitation() {
      if (triggered) return;
      triggered = true;

      // Step 1: crack the seal
      seal.classList.add('breaking');
      hint.style.opacity = '0';

      // Step 2: open flap (card rises above it due to z-index 20 > flap z-index 15)
      setTimeout(function () {
        envelope.classList.add('opened');
      }, 380);

      // Step 3: show message
      setTimeout(function () {
        openingMsg.classList.add('show');
      }, 750);

      // Step 4: fade out
      setTimeout(function () {
        overlay.classList.add('active');
      }, 1700);

      // Step 5: navigate
      setTimeout(function () {
        window.location.href = 'site.html';
      }, 2700);
    }

    seal.addEventListener('click', openInvitation);
    seal.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') openInvitation();
    });
  </script>
</body>
</html>
